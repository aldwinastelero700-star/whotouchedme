{fontFamily:"'Merriweather', serif"},children:"Hindi ito mabilisang babasahin. Ito ay dahan-dahang paglalakbay kasama ang isang babaeng halos makalimutan na ng kasaysayan, pero hinding-hindi nakalimutan ni Jesus. Bawat kabanata ay paanyaya para tanungin ang sarili: ako ba ay nakiki-siksik lang, o tunay na humihipo?"}),a("div",{className:"space-y-3",children:ar.filter((s)=>s.id.startsWith("k")||["panimula","pangwakas","panalangin","may-akda"].includes(s.id)).map((s,f)=>A("button",{onClick:()=>u(s.id),className:"w-full text-left group flex gap-5 items-start p-5 rounded-[16px] bg-white border border-[#EFE6D1] hover:border-[#8C6A2F]/40 hover:shadow-[0_8px_24px_rgba(140,106,47,0.08)] transition",children:[a("div",{className:"shrink-0 w-10 h-10 rounded-full bg-[#FDF6E3] border border-[#E8DCC3] flex items-center justify-center text-[13px] font-bold text-[#8C6A2F]",children:String(f+1).padStart(2,"0")}),A("div",{children:[A("div",{className:"text-[16px] md:text-[18px] font-bold leading-[1.3] text-[#1A1A1A] group-hover:text-[#8C6A2F] transition",style:{fontFamily:"'Merriweather', serif"},children:[s.label,": ",s.desc]}),a("div",{className:"mt-1 text-[13px] text-[#7A6E55]",children:"Basahin • 6-8 minuto"})]})]},s.id))})]}),a(tu,{}),A("section",{id:"panimula",className:"scroll-mt-10 max-w-[760px] mx-auto py-10",children:[a(fe,{num:"PANIMULA",title:"Bago Ko Itanong, Sino ang Humipo kay Jesus?"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#222222] font-[400]",style:{fontFamily:"'Merriweather', Georgia, serif"},children:[a("p",{className:"dropcap",children:"Habang binabasa ko ang kuwento ng babaeng dinudugo, hindi ko maiwasang mapahinto sa isang detalye na madalas nating nalalagpasan. Napakaraming tao ang sumisiksik kay Jesus. Sabi ni Lucas, halos magkandarapa na ang karamihan. Lahat sila ay malapit. Lahat sila ay humihipo. Pero isa lang ang hinanap ni Jesus. Isa lang ang nagpatigil sa Kanya. At doon ako unang tinamaan."}),a("p",{children:"Ilang beses na ba akong nasa gitna ng “crowd” ng pananampalataya? Linggo-linggo nasa simbahan. Araw-araw nagdarasal, kahit mabilis. Nagbabasa ng Bibliya, naglilingkod, tumutugtog, nagtuturo, nagbibigay. Sa panlabas, malapit na malapit ako kay Jesus. Pero kung tatanungin ako nang tapat — mayroon ba talagang bahagi sa akin na humihipo sa Kanya nang may paniniwala, o nakikisiksik lang ako dahil iyon ang nakasanayan?"}),a("p",{children:"Napaisip ako: hindi pala sapat ang proximity. Hindi sapat ang religious routine. Hindi sapat ang pagiging busy sa gawain ng Diyos. Maraming tao ang malapit kay Jesus sa pisikal, pero malayo ang puso. Maraming humihipo sa Kanyang damit dahil sa siksikan, pero hindi lahat ay humihipo dahil sa pananampalataya. At ang nakakatakot, puwede pala akong maging isa sa kanila — present sa lahat ng gawain, pero absent ang tunay na pagtitiwala."}),a(Ne,{children:"Maraming malapit kay Jesus, pero kakaunti ang tunay na humihipo sa Kanya nang may pananampalataya."}),a("p",{children:"Kung ako ang nasa kalagayan niya, labindalawang taon kang may karamdaman. Labindalawang taon kang itinuturing na marumi. Labindalawang taon kang hindi puwedeng hawakan, hindi puwedeng yakapin, hindi puwedeng lumapit sa templo. Napaisip ako, anong klaseng pagod ang nararamdaman ng isang taong ganoon? Hindi lang pisikal ang pagod niya — pagod ang kaluluwa. Pagod na magpaliwanag. Pagod na umasa at mabigo. Pagod na maging invisible sa isang lipunang sanay nang umiwas sa kanya."}),a("p",{children:"Dito ako tinamaan nang husto: kung gaano karaming beses din akong pagod sa pananampalataya. Pagod na magdasal na parang walang sagot. Pagod na maghintay. Pagod na magpakatatag. At minsan, sa pagod na iyon, natutukso akong makisama na lang sa agos — sumama sa crowd, pero hindi na talaga umaasa. Dumadalo, pero hindi na naniniwala. Kumakanta, pero hindi na sumasamba mula sa puso."}),a("p",{children:"Kaya bago ko itanong kung sino ang humipo kay Jesus, kailangan ko munang itanong sa sarili ko: ako ba, sa dami ng beses kong lumapit, kailan ba ako huling humipo sa Kanya nang may buong pag-asa? Kailan ba huling hinawakan ko ang laylayan ng Kanyang damit at sinabing, “Panginoon, kung wala nang ibang makakatulong, Ikaw na lang. Kung wala nang ibang pag-asa, Ikaw pa rin.”"}),a("p",{children:"Ang aklat na ito ay hindi theological debate. Hindi ito malalim na Greek exegesis. Ito ay salamin. Dahan-dahan nating sisilipin ang bawat sulok ng kuwentong ito at hahayaang tanungin tayo mismo ni Jesus. Hindi para hiyain, kundi para pagalingin. Hindi para takutin, kundi para tawagin muli sa isang pananampalatayang tahimik, simple, pero totoo."})]}),A("div",{className:"mt-12 flex justify-between",children:[a("button",{onClick:()=>u("talaan"),className:"text-[13px] tracking-[0.14em] uppercase font-bold text-[#8C6A2F]",children:"← Talaan"}),a("button",{onClick:()=>u("k1"),className:"h-11 px-6 rounded-full bg-[#1A1A1A] text-white text-[13px] font-bold tracking-[0.12em] uppercase",children:"Kabanata 1 →"})]})]}),A("section",{id:"k1",className:"scroll-mt-10 max-w-[760px] mx-auto py-12",children:[a(fe,{num:"KABANATA 1",title:"Labindalawang Taon ng Paghihintay, Isang Hakbang ng Pananampalataya"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#222222]",style:{fontFamily:"'Merriweather', Georgia, serif"},children:[a("p",{className:"dropcap",children:"Habang binabasa ko ang “labindalawang taon”, bigla akong napabuntong-hininga. Labindalawang taon ay hindi maikling panahon. Sa labindalawang taon, puwedeng makatapos ang isang bata mula elementarya hanggang kolehiyo. Sa labindalawang taon, maraming pangarap ang puwedeng mabuo at mamatay. At para sa babaeng ito, labindalawang taon siyang nabubuhay na may sugat na hindi gumagaling, kahihiyang hindi matakasan, at katahimikang pilit na ipinapataw ng lipunan sa kanya."}),a("p",{children:"Napaisip ako, paano siya bumangon araw-araw? Ano ang iniisip niya tuwing umaga paggising niya at mararamdaman na naman niya ang parehong kahinaan? Siguro may mga araw na sinabi niya sa sarili, “Baka bukas, okay na.” Pero dumating ang bukas, at pareho pa rin. At ang bukas na iyon ay naging linggo, naging buwan, naging taon. Labindalawang taon."}),a("p",{children:"Kung ako ang nasa kalagayan niya, baka matagal na akong sumuko. Hindi ko maiwasang tanungin ang sarili ko: ilang beses na ba akong sumuko sa panalangin dahil lang sa dalawang linggong walang sagot? Ilang beses ko nang sinabing “pagod na ako maghintay” samantalang siya, labindalawang taon siyang naghintay nang hindi namamatay ang maliit na ilaw ng pag-asa sa puso niya."}),a(Ne,{children:"Ang pananampalataya ay hindi nasusukat sa bilis ng sagot, kundi sa tibay ng paghawak habang naghihintay."}),a("p",{children:"Dito ako tinamaan. Akala ko dati, ang pananampalataya ay malakas kapag mabilis makuha ang hinihingi. Pero sa kanya, nakita ko na ang tunay na pananampalataya ay lumalaban kahit matagal. Ang tunay na pananampalataya ay hindi maingay. Hindi ito nagpopost ng testimony agad. Tahimik lang itong nagpapatuloy, kahit walang nakakakita."}),a("p",{children:"At may isang hakbang siyang ginawa na nagpabago sa lahat. Sabi sa teksto, narinig niya ang tungkol kay Jesus. At sa pagkarinig na iyon, may nabuhay sa kanya. Hindi pa siya gumagaling, pero may gumalaw na sa loob niya. Napaisip ako: minsan, ang himala ay hindi nagsisimula sa paggaling, nagsisimula ito sa pakikinig. Isang balita tungkol kay Jesus na sapat para magkaroon ulit ng lakas ng loob."}),a("p",{children:"Habang binabasa ko ito ngayon, tinatanong ko ang sarili ko: anong balita tungkol kay Jesus ang kailangan kong marinig muli? Na Siya ay mahabagin pa rin? Na hindi pa Siya tapos sa akin? Na kahit labindalawang taon na akong naghihintay, may isang hakbang pa na puwede kong gawin — ang lumapit. Hindi ko kailangang maging malakas. Kailangan ko lang humakbang, kahit nanginginig."}),a("p",{children:"Kung ikaw ay nasa mahabang paghihintay ngayon — sa kagalingan, sa trabaho, sa pag-aasawa, sa pagbabalik ng isang mahal sa buhay, sa kapatawaran — gusto kong sabihin sa iyo na nakikita ka ni Jesus. Hindi nasayang ang mga taon mo. At minsan, isang hakbang lang ng pananampalataya ang pagitan mo at ng himalang matagal mo nang hinihintay."})]}),A("div",{className:"mt-10 flex justify-between",children:[a("button",{onClick:()=>u("panimula"),className:"text-[13px] font-bold tracking-[0.12em] uppercase text-[#8C6A2F]",children:"← Panimula"}),a("button",{onClick:()=>u("k2"),className:"h-11 px-6 rounded-full bg-[#1A1A1A] text-white text-[13px] font-bold uppercase tracking-[0.12em]",children:"Kabanata 2 →"})]})]}),A("section",{id:"k2",className:"scroll-mt-10 max-w-[760px] mx-auto py-12",children:[a(fe,{num:"KABANATA 2",title:"Kapag Naubos ang Lahat, Saan Ako Kakapit?"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#222222]",style:{fontFamily:"'Merriweather', serif"},children:[a("p",{className:"dropcap",children:"Sabi ni Marcos, “Naubos na ang lahat ng kanyang ari-arian, at lalong lumala pa ang kanyang sakit.” Habang binabasa ko iyon, parang may kumurot sa dibdib ko. Hindi lang siya may sakit — naubusan pa siya. Naubusan ng pera, naubusan ng pag-asa, naubusan ng taong matatakbuhan. Kung ako ang nasa kalagayan niya, saan ako kakapit kapag wala nang makapitan?"}),a("p",{children:"Napaisip ako sa sarili kong buhay. May mga pagkakataon din na pakiramdam ko ay ubos na ako. Ubos ang ipon dahil sa ospital. Ubos ang lakas dahil sa puyat at pag-aalala. Ubos ang pasensya. Ubos ang salita sa panalangin — paulit-ulit na lang ang “Lord, tulungan Mo ako.” At ang pinakamasakit, minsan pakiramdam mo ubos ka na rin sa tingin ng tao. Wala nang gustong makinig dahil sawang-sawa na sila sa kuwento mo."}),a("p",{children:"Hindi ko maiwasang tanungin ang sarili ko: bakit hinahayaan ng Diyos na maubos muna tayo bago Siya kumilos? Bakit kailangang dumaan sa kawalan? Pero habang binabasa ko muli ang kuwento, may napansin ako — noong naubos ang lahat, doon lang siya lubusang napatingin kay Jesus. Habang mayroon pa siyang pera, ang tingin niya ay nasa manggagamot. Habang may koneksyon pa siya, ang tingin niya ay nasa tao. Pero nang wala na, ang tingin niya ay napunta sa Isa na hindi nauubos."}),a(Ne,{children:"Minsan, kailangang maubos ang lahat ng hawak ng kamay mo, para matutunan mong kumapit nang mahigpit kay Jesus."}),a("p",{children:"Dito ako tinamaan. Maraming beses kong sinabi na si Jesus ang lakas ko, pero sa totoo lang, si Jesus ay plan B ko lang kapag ubos na ang plan A. Kapag hindi na gumana ang diskarte, saka ko lang Siya tatawagin. Pero ang babaeng ito ay nagturo sa akin: ang pagkaubos ay hindi katapusan — ito ay paanyaya. Paanyaya na ilipat ang bigat ng tiwala mula sa mga bagay na nauubos, patungo sa Diyos na hindi nauubos kailanman."}),a("p",{children:"Kung ikaw ay nasa punto ng pagkaubos ngayon, gusto kong maniwala kang hindi ka pinapabayaan. Ang kawalan mo ay hindi patunay na wala ang Diyos. Minsan, ang kawalan mo mismo ang espasyong inihahanda Niya para punuin ng Kanyang presensya. Hindi ka talaga nauubusan kapag si Jesus ang pinanghahawakan mo."}),a("p",{children:"Kaya tinatanong ko ang sarili ko ngayon: saan ako kumakapit? Sa bank account? Sa relasyon? Sa talino? Sa reputasyon? Lahat iyan ay nauubos. Pero si Jesus — kailanman ay hindi. At kung Siya ang hahawakan ko ngayon, kahit nanginginig ang kamay ko, sapat na iyon. Sapat na ang isang mahigpit na kapit sa Kanya, kaysa sa maluwag na kapit sa mundo."})]}),A("div",{className:"mt-10 flex justify-between",children:[a("button",{onClick:()=>u("k1"),className:"text-[13px] font-bold uppercase tracking-[0.12em] text-[#8C6A2F]",children:"← Kabanata 1"}),a("button",{onClick:()=>u("k3"),className:"h-11 px-6 rounded-full bg-[#1A1A1A] text-white text-[13px] font-bold uppercase tracking-[0.12em]",children:"Kabanata 3 →"})]})]}),A("section",{id:"k3",className:"scroll-mt-10 max-w-[760px] mx-auto py-12",children:[a(fe,{num:"KABANATA 3",title:"Hindi Ako Humingi ng Atensyon—Humingi Ako ng Kagalingan"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#222222]",style:{fontFamily:"'Merriweather', serif"},children:[a("p",{className:"dropcap",children:"Napansin mo ba na hindi siya sumigaw? Sa isang kuwentong puno ng sigawan — sumisigaw ang mga demonyo, sumisigaw ang mga tao, sumisigaw si Jairo na “halika sa bahay ko!” — siya ay tahimik lang. Habang binabasa ko ito, parang nakita ko ang sarili ko na laging naghahanap ng atensyon kapag nasasaktan. Gusto kong may makakita, may makapansin, may mag-like, may mag-comment ng “praying for you.”"}),a("p",{children:"Pero siya, hindi. Hindi siya humingi ng atensyon. Humingi siya ng kagalingan. At malaki ang pagkakaiba noon. Ang atensyon ay pansamantala, ang kagalingan ay pangmatagalan. Ang atensyon ay nakatuon sa tao, ang kagalingan ay nakatuon kay Jesus. At dito ako tinamaan nang malakas: minsan, mas gusto ko pang mapansin kaysa gumaling. Mas gusto ko pang maawa sila sa akin kaysa tuluyan akong palayain ng Diyos sa sugat ko."}),a("p",{children:"Napaisip ako: ilang beses na ba akong lumapit kay Jesus pero ang totoo, ang hinahanap ko ay atensyon ng tao? Lumapit ako sa simbahan para makita nila akong faithful, pero hindi para gumaling. Nag-post ako ng Bible verse para makita nilang spiritual ako, pero hindi para talagang makatagpo si Jesus sa salita Niya. Kung ako ang nasa kalagayan niya, baka matagal na akong nag-live at nagkuwento sa lahat. Pero siya, pinili niyang lumapit nang palihim, nang tahimik, nang may kababaang-loob."}),a(Ne,{children:"Hindi mo kailangang maging maingay para marinig ka ni Jesus. Kailangan mo lang maging totoo."}),a("p",{children:"Dito ko na-realize na ang pananampalataya ay hindi performance. Hindi mo kailangang magpakitang-gilas kay Jesus. Hindi mo kailangang gumamit ng magagandang salita. Hindi mo kailangang umiyak nang malakas para patunayan na sincere ka. Ang kailangan mo lang ay lumapit, kahit tahimik, pero totoo."}),a("p",{children:"Hindi ko maiwasang tanungin ang sarili ko: ano ba talaga ang hinihingi ko kapag lumalapit ako kay Jesus? Gusto ko ba talagang gumaling, o gusto ko lang mapansin? Gusto ko ba talagang mapalaya sa galit, sa inggit, sa takot, sa kahihiyan — o gusto ko lang na may maka-relate sa sakit ko? Ang babaeng ito ay nagturo sa akin na kung kagalingan ang tunay na hahanapin ko, kay Jesus ko lang ito makikita, at hindi sa palakpakan ng tao."}),a("p",{children:"Kaya ngayon, sa panalangin ko, natututo akong maging simple: “Lord, hindi ko na kailangan ng atensyon ng lahat. Kailangan ko po ng paghipo Mo. Pagalingin Mo ako — hindi lang sa katawan, kundi sa puso kong pagod nang magpanggap na okay ako.” At alam kong naririnig Niya iyon. Dahil kahit tahimik, kapag totoo ang paglapit, hindi ito nakakaligtaan ni Jesus."})]}),A("div",{className:"mt-10 flex justify-between",children:[a("button",{onClick:()=>u("k2"),className:"text-[13px] font-bold uppercase tracking-[0.12em] text-[#8C6A2F]",children:"← Kabanata 2"}),a("button",{onClick:()=>u("k4"),className:"h-11 px-6 rounded-full bg-[#1A1A1A] text-white text-[13px] font-bold uppercase tracking-[0.12em]",children:"Kabanata 4 →"})]})]}),A("section",{id:"k4",className:"scroll-mt-10 max-w-[760px] mx-auto py-12",children:[a(fe,{num:"KABANATA 4",title:"Ang Hawak na May Kasamang Paniniwala"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#222222]",style:{fontFamily:"'Merriweather', serif"},children:[a("p",{className:"dropcap",children:"Habang binabasa ko ang talatang “mahawakan ko lamang ang Kanyang damit,” huminto ako. Hindi kamay ni Jesus ang hinawakan niya — laylayan lang ng damit. Parang napakaliit. Parang kulang. Pero sa maliit na hawak na iyon, may malaking paniniwala. At doon ko nakita na ang kapangyarihan ay wala sa laki ng hawak, kundi sa laki ng pinanghahawakan."}),a("p",{children:"Maraming tao ang humawak kay Jesus noong araw na iyon. Siksikan, tulakan, baliaan. Lahat ay may pisikal na contact. Pero iisa lang ang may paniniwalang kasama. Iisa lang ang may pusong nagsasabing, “Si Jesus lang ang pag-asa ko.” At iyon ang kaibahan ng ordinaryong hawak at ng hawak na may pananampalataya."}),a("p",{children:"Napaisip ako sa sarili kong pananampalataya. Maraming beses ko nang nahawakan ang Bibliya, pero hindi ko ito pinaniwalaan. Maraming beses na akong dumalo sa gawain, pero hindi ako umasang may gagawin ang Diyos. Maraming beses na akong nag-communion, pero parang routine lang. Pisikal na hawak, pero walang espiritwal na kapit. Kung ako ang nasa kalagayan niya, baka hawak din ako nang hawak, pero walang nangyayari — kasi wala pala akong paniniwala."}),a(Ne,{children:"Hindi lahat ng humahawak ay naniniwala, pero lahat ng naniniwala, siguradong may mahahawakan — si Jesus mismo."}),a("p",{children:"Dito ako tinamaan. Tinatanong ako ng kuwentong ito: ano ang hawak mo ngayon na may kasamang paniniwala? O baka hawak mo lang dahil wala kang ibang mahawakan? Ang pananampalataya kasi ay hindi magic touch. Hindi ito parang anting-anting na kapag nahawakan mo, automatic gagaling ka. Ang pananampalataya ay pagtitiwala sa Person — kay Jesus mismo."}),a("p",{children:"Hindi ko maiwasang tanungin ang sarili ko: paano ba humawak nang may paniniwala? Siguro nagsisimula ito sa pagsasabing, “Panginoon, hindi ko man maintindihan ang lahat, nagtitiwala ako na kaya Mo.” Humawak nang may paniniwala ay hindi nangangahulugang wala kang takot — nangangahulugan itong kahit may takot ka, pipiliin mo pa ring kumapit. Kahit nanginginig, hahawakan mo pa rin."}),a("p",{children:"Habang binabasa ko ito, naisip ko na baka matagal nang hinihintay ni Jesus ang hawak kong may paniniwala. Hindi yung hawak na pabasta-basta. Hindi yung hawak na dahil napilitan lang. Kundi yung hawak na nagsasabing, “Ikaw lang, Lord. Ikaw lang ang sagot.” At kapag ganoon ang hawak ko, hindi Niya ako bibiguin. Dahil ang hawak na may paniniwala ay laging may kasamang kapangyarihang lumalabas mula sa Kanya."})]}),A("div",{className:"mt-10 flex justify-between",children:[a("button",{onClick:()=>u("k3"),className:"text-[13px] font-bold uppercase tracking-[0.12em] text-[#8C6A2F]",children:"← Kabanata 3"}),a("button",{onClick:()=>u("k5"),className:"h-11 px-6 rounded-full bg-[#1A1A1A] text-white text-[13px] font-bold uppercase tracking-[0.12em]",children:"Kabanata 5 →"})]})]}),A("section",{id:"k5",className:"scroll-mt-10 max-w-[760px] mx-auto py-12",children:[a(fe,{num:"KABANATA 5",title:"Sa Gitna ng Maraming Humihipo, May Isang Hinahanap si Jesus"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#222222]",style:{fontFamily:"'Merriweather', serif"},children:[a("p",{className:"dropcap",children:"Habang binabasa ko ang eksenang iyon — si Jesus na huminto sa gitna ng karamihan at nagtanong, “Sino ang humipo sa Akin?” — hindi ko mapigilang ngumiti at kabahan nang sabay. Ngumiti kasi, sa dami ng tao, hinanap Niya pa rin ang isa. Kinabahan kasi, baka ako ang tinatanong Niya."}),a("p",{children:"Isipin mo: nagmamadali si Jesus papunta sa bahay ni Jairo. May batang naghihingalo. Bawat segundo ay mahalaga. Pero huminto Siya. Bakit? Dahil may isang taong humipo sa Kanya nang may pananampalataya. At para kay Jesus, hindi iyon puwedeng palampasin. Kahit gaano pa karami ang tao, kahit gaano pa ka-urgent ang schedule, kapag may isang pusong tunay na kumapit sa Kanya, hihinto Siya."}),a("p",{children:"Napaisip ako: ganito ba ako kahalaga kay Jesus? Sa mundong ang daming humihingi ng atensyon, sa mundong ang daming mas magaling, mas banal, mas matalino kaysa sa akin — hinahanap pa rin ba Niya ako? At ang sagot ng kuwentong ito ay malinaw na oo. Oo, hinahanap ka. Oo, pinapansin ka. Oo, kahit tahimik kang lumapit, naririnig ka."}),a(Ne,{children:"Sa mata ng tao, isa ka lang sa karamihan. Sa mata ni Jesus, ikaw ang hinahanap."}),a("p",{children:"Kung ako ang nasa kalagayan niya, baka nagtago ako lalo. Baka sinabi kong, “Wag na lang, okay na ako, gumaling na ako, aalis na lang ako nang tahimik.” Pero si Jesus, hindi pumayag. Hinanap Niya. Hindi dahil gusto Niyang ipahiya, kundi dahil gusto Niyang makilala nang personal ang taong matagal nang hindi pinapansin ng lipunan."}),a("p",{children:"Dito ako tinamaan. Ilang beses na ba akong lumapit kay Jesus na gusto ko lang ng blessing, pero ayaw ko ng relationship? Gusto ko lang ng sagot, pero ayaw ko ng pag-uusap. Gusto ko lang gumaling, pero ayaw kong makilala nang mas malalim. Pero si Jesus, hindi Siya kuntento sa “touch and go.” Gusto Niya ng face-to-face. Gusto Niyang ang taong humipo ay maging taong makakakilala sa Kanya nang personal."}),a("p",{children:"Hindi ko maiwasang tanungin ang sarili ko: hinahayaan ko ba si Jesus na hanapin ako? O pagkatapos kong makuha ang gusto ko, tumatakbo na agad ako? Ang babaeng ito ay tinuruan akong manatili kahit nanginginig. Dahil kapag hinahanap ka ni Jesus, hindi para parusahan ka — kundi para kilalanin ka, pangalanan ka, at ibalik ang dangal na matagal nang nawala sa iyo."})]}),A("div",{className:"mt-10 flex justify-between",children:[a("button",{onClick:()=>u("k4"),className:"text-[13px] font-bold uppercase tracking-[0.12em] text-[#8C6A2F]",children:"← Kabanata 4"}),a("button",{onClick:()=>u("k6"),className:"h-11 px-6 rounded-full bg-[#1A1A1A] text-white text-[13px] font-bold uppercase tracking-[0.12em]",children:"Kabanata 6 →"})]})]}),A("section",{id:"k6",className:"scroll-mt-10 max-w-[760px] mx-auto py-12",children:[a(fe,{num:"KABANATA 6",title:"Ang Pananampalatayang Hindi Man Nakikita ng Tao, Nakikita ni Jesus"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#222222]",style:{fontFamily:"'Merriweather', serif"},children:[a("p",{className:"dropcap",children:"Walang nakakita sa paghawak niya. Walang nakapansin. Walang pumalakpak. Sa mata ng karamihan, isa lang siyang babaeng nakisiksik. Pero sa mata ni Jesus, isa siyang babaeng may dakilang pananampalataya. Habang binabasa ko ito, bigla akong napaluha. Ilang beses na ba akong nalungkot dahil walang nakakita sa effort ko, sa panalangin ko, sa paglilingkod ko?"}),a("p",{children:"Minsan, nakakapagod maging invisible. Nagdarasal ka nang tahimik, pero walang nakakaalam. Nagbibigay ka nang palihim, pero walang nagpapasalamat. Lumalaban ka sa tukso araw-araw, pero walang pumupuri. At minsan, naiisip mong, “May nakakakita pa ba?” Pero ang kuwentong ito ay sumisigaw: Oo, may nakakakita — si Jesus."}),a("p",{children:"Napaisip ako: ang pananampalatayang tunay ay hindi laging nakikita ng tao. Hindi ito nasusukat sa laki ng ministry, sa ganda ng boses sa worship, sa dami ng verses na kabisado. Ang pananampalatayang tunay ay minsan tahimik, nanginginig, tago, pero totoo. At kahit hindi ito makita ng tao, nakikita ito ni Jesus."}),a(Ne,{children:"Ang Diyos ay hindi humahanga sa ingay ng karamihan; humahanga Siya sa bulong ng pananampalataya."}),a("p",{children:"Kung ako ang nasa kalagayan niya, baka gusto kong may makakita para may magpatunay na totoo ang pinagdadaanan ko. Pero siya, hindi niya kailangan ng audience. Sapat na sa kanya na makita siya ni Jesus. At doon ako tinamaan — kailan ba ako huling naging kuntento na si Jesus lang ang nakakita?"}),a("p",{children:"Hindi ko maiwasang tanungin ang sarili ko: para kanino ba ako nabubuhay? Para sa mata ng tao o para sa mata ni Jesus? Kung para sa mata ng tao, lagi akong mapapagod. Lagi akong maghahabol ng validation. Pero kung para sa mata ni Jesus, may kapahingahan. Dahil si Jesus, hindi Niya kailangan ng malaking palabas. Hinahanap lang Niya ang pusong totoo."}),a("p",{children:"Kaya ngayon, kapag pakiramdam ko ay walang nakakakita, inaalala ko ang babaeng ito. Hindi man siya nakita ng karamihan, nakita siya ni Jesus. At nang makita siya ni Jesus, hindi lang siya gumaling — nabigyan siya ng bagong pagkakakilanlan. Hindi na siya “yung babaeng dinudugo.” Siya na ay “anak.” At ganoon din ang gagawin ni Jesus sa atin — kapag nakita Niya ang ating pananampalataya, babaguhin Niya ang ating pangalan."})]}),A("div",{className:"mt-10 flex justify-between",children:[a("button",{onClick:()=>u("k5"),className:"text-[13px] font-bold uppercase tracking-[0.12em] text-[#8C6A2F]",children:"← Kabanata 5"}),a("button",{onClick:()=>u("k7"),className:"h-11 px-6 rounded-full bg-[#1A1A1A] text-white text-[13px] font-bold uppercase tracking-[0.12em]",children:"Kabanata 7 →"})]})]}),A("section",{id:"k7",className:"scroll-mt-10 max-w-[760px] mx-auto py-12",children:[a(fe,{num:"KABANATA 7",title:"Bakit Hindi Ako Tumakbo Palayo Nang Tinawag Niya Ako?"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#222222]",style:{fontFamily:"'Merriweather', serif"},children:[a("p",{className:"dropcap",children:"Habang binabasa ko ang bahaging “nanginginig na lumapit ang babae at nagpatirapa,” hindi ko maiwasang isipin ang sarili ko. Kung ako ang nasa kalagayan niya, baka tumakbo ako palayo. Bakit? Kasi ayon sa batas, marumi siya. Ang humipo sa malinis ay nagiging marumi. Sa isip niya, baka nagkasala siya kay Jesus. Baka mapagalitan siya. Baka ipahiya siya sa harap ng lahat."}),a("p",{children:"Pero hindi siya tumakbo. Lumapit siya. Nanginginig man, lumapit pa rin. At doon ko nakita ang isa sa pinakamagandang larawan ng pagsisisi at pagtitiwala. Ang tunay na pananampalataya ay hindi tumatakbo palayo kapag tinawag, kahit takot na takot. Ang tunay na pananampalataya ay lumalapit, kahit nanginginig."}),a("p",{children:"Napaisip ako: ilang beses na ba akong tinawag ni Jesus pero tumakbo ako palayo? Tinawag Niya akong magpatawad, pero tumakbo ako sa galit. Tinawag Niya akong magsisi, pero tumakbo ako sa katwiran. Tinawag Niya akong lumapit, pero tumakbo ako sa kahihiyan. Kung ako ang nasa kalagayan niya, baka sinabi kong, “Hindi ako karapat-dapat.” At totoo naman — hindi talaga tayo karapat-dapat. Pero doon papasok ang biyaya."}),a(Ne,{children:"Ang tawag ni Jesus ay hindi para ipahiya ang iyong kahapon, kundi para buksan ang iyong bukas."}),a("p",{children:"Dito ako tinamaan. Akala ko dati, kapag tinawag ako ni Jesus, para akong sisingilin. Para akong i-judge. Pero sa kuwentong ito, ang tawag ni Jesus ay hindi paninisi — ito ay pag-anyaya. Hindi Siya galit na “Sino ang humipo sa Akin?!” kundi puno ng pagmamahal na “Nasaan ka? Gusto kitang makita. Gusto kitang makilala.”"}),a("p",{children:"Hindi ko maiwasang tanungin ang sarili ko: ano ang pumipigil sa akin para lumapit kapag tinatawag Niya ako? Kahihiyan ba? Takot na baka hindi ako tanggapin? Takot na baka malaman ng lahat ang totoo kong kalagayan? Pero ang babaeng ito ay nagturo sa akin na kahit nanginginig, puwedeng lumapit. At kapag lumapit ka kay Jesus nang may pagpapakumbaba, hindi ka Niya itataboy. Yayakapin ka Niya sa Kanyang biyaya."}),a("p",{children:"Kaya kung naririnig mo ngayon ang tawag ni Jesus — sa gitna ng iyong kasalanan, kahihiyan, takot, at pag-aalinlangan — huwag kang tumakbo palayo. Lumapit ka. Nanginginig man ang tuhod mo, lumapit ka pa rin. Dahil ang nasa kabilang dulo ng tawag na iyon ay hindi parusa, kundi pagmamahal na handang magpatawad at magpagaling."})]}),A("div",{className:"mt-10 flex justify-between",children:[a("button",{onClick:()=>u("k6"),className:"text-[13px] font-bold uppercase tracking-[0.12em] text-[#8C6A2F]",children:"← Kabanata 6"}),a("button",{onClick:()=>u("k8"),className:"h-11 px-6 rounded-full bg-[#1A1A1A] text-white text-[13px] font-bold uppercase tracking-[0.12em]",children:"Kabanata 8 →"})]})]}),A("section",{id:"k8",className:"scroll-mt-10 max-w-[760px] mx-auto py-12",children:[a(fe,{num:"KABANATA 8",title:"Anak, Ang Pananampalataya Mo ang Nagpagaling sa Iyo"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#222222]",style:{fontFamily:"'Merriweather', serif"},children:[a("p",{className:"dropcap",children:"Habang binabasa ko ang mga salitang “Anak,” napahinto ako nang matagal. Labindalawang taon siyang tinawag na marumi. Labindalawang taon siyang walang pangalan sa lipunan. Pero sa isang iglap, nang makita siya ni Jesus, tinawag siyang “Anak.” Hindi “babae,” hindi “marumi,” hindi “maysakit” — kundi “Anak.” At doon ko naramdaman kung gaano kalalim ang pagmamahal ni Jesus."}),a("p",{children:"Napaisip ako: gaano kahalaga na marinig mong tinatawag kang anak? Sa mundong sanay tayong tawagin base sa ating nagawa — “palpak,” “mahina,” “makasalanan,” “failure” — iba ang dating kapag tinawag kang “anak” ng Diyos mismo. Ang “anak” ay nangangahulugang pag-aari ka. Minamahal ka. May lugar ka. Hindi ka na estranghero. Hindi ka na pabigat. Anak ka."}),a("p",{children:"At sinabi pa ni Jesus, “Ang pananampalataya mo ang nagpagaling sa iyo.” Hindi sinabi na “ang damit ko” o “ang lakas ko” — kundi ang pananampalataya mo. Parang sinasabi ni Jesus, “Pinahahalagahan Ko ang tiwala mo sa Akin. Nakita Ko. At dahil nagtiwala ka, pinagaling kita.” Dito ako tinamaan: pinahahalagahan ni Jesus ang ating pananampalataya, gaano man ito kaliit."}),a(Ne,{children:"Hindi ka pinagaling dahil malaki ang pananampalataya mo, pinagaling ka dahil malaki ang Diyos na pinanampalatayaan mo."}),a("p",{children:"Kung ako ang nasa kalagayan niya, baka hindi ako makapaniwala. Labindalawang taon kong hinintay ang salitang ito — na ako ay magaling na, na ako ay tanggap na. Pero heto, sinabi mismo ni Jesus. At hindi lang katawan ang gumaling — pati pagkakakilanlan. Mula sa marumi, naging anak. Mula sa itinakwil, naging tinanggap."}),a("p",{children:"Hindi ko maiwasang tanungin ang sarili ko: naniniwala ba akong anak ako ng Diyos? O hanggang ngayon, alipin pa rin ako ng dati kong pangalan? Alipin ng kahihiyan, ng kasalanan, ng sinasabi ng tao? Ang kuwentong ito ay paalala na kapag hinawakan mo si Jesus nang may pananampalataya, hindi lang kagalingan ang ibibigay Niya — ibibigay Niya ang bagong pangalan."}),a("p",{children:"Kaya ngayon, tuwing nagdadasal ako at pakiramdam ko ay ang liit-liit ko, inaalala ko ang salitang “Anak.” Hindi ako stranger kay Jesus. Hindi ako istorbo. Anak ako. At kung anak ako, may karapatan akong lumapit. May karapatan akong humawak. At may karapatan akong maniwala na ang pananampalataya kong maliit ay sapat sa Diyos na malaki."})]}),A("div",{className:"mt-10 flex justify-between",children:[a("button",{onClick:()=>u("k7"),className:"text-[13px] font-bold uppercase tracking-[0.12em] text-[#8C6A2F]",children:"← Kabanata 7"}),a("button",{onClick:()=>u("k9"),className:"h-11 px-6 rounded-full bg-[#1A1A1A] text-white text-[13px] font-bold uppercase tracking-[0.12em]",children:"Kabanata 9 →"})]})]}),A("section",{id:"k9",className:"scroll-mt-10 max-w-[760px] mx-auto py-12",children:[a(fe,{num:"KABANATA 9",title:"Hindi Lang Kagalingan ang Hinahanap Ko"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#222222]",style:{fontFamily:"'Merriweather', serif"},children:[a("p",{className:"dropcap",children:"Habang binabasa ko ang dulo ng kuwento, may napansin akong hindi ko napansin dati. Gumaling na siya sa kalagitnaan pa lang. Sabi sa teksto, “Naramdaman niyang magaling na siya.” Ibig sabihin, tapos na ang himala sa katawan. Puwede na siyang umuwi nang tahimik. Puwede na siyang magdiwang nang mag-isa. Pero bakit siya pinahinto pa ni Jesus?"}),a("p",{children:"Dahil may mas malalim pa palang himalang gustong ibigay si Jesus — hindi lang kagalingan ng katawan, kundi kapayapaan ng kaluluwa. Sabi ni Jesus, “Humayo kang payapa.” Sa wikang Griego, ang payapa ay “eirene” — hindi lang absence ng gulo, kundi wholeness, buong pagkatao na naibalik. Gumaling ang katawan niya nang mahawakan niya ang damit ni Jesus, pero gumaling ang buong pagkatao niya nang marinig niya ang tinig ni Jesus."}),a("p",{children:"Napaisip ako: ano ba talaga ang hinahanap ko kay Jesus? Kagalingan lang ba? Solusyon lang ba sa problema? O Siya mismo? Kasi kung kagalingan lang ang habol ko, pagkatapos gumaling, aalis na ako. Pero kung si Jesus mismo ang habol ko, kahit gumaling na ako, mananatili pa rin ako sa paanan Niya."}),a(Ne,{children:"Minsan, ang kagalingan ay simula pa lang. Ang tunay na himala ay ang makilala mo nang personal si Jesus."}),a("p",{children:"Kung ako ang nasa kalagayan niya, baka kuntento na ako sa gumaling. Pero salamat, hindi pumayag si Jesus na hanggang doon lang. Gusto Niya, hindi lang ako gumaling — gusto Niyang mapayapa ako. Hindi lang mawala ang sakit, kundi mawala ang takot, ang hiya, ang pangungulila. Gusto Niyang buo akong gumaling."}),a("p",{children:"Dito ako tinamaan nang husto. Maraming beses akong lumapit kay Jesus na ang dala ko ay checklist: “Lord, pagalingin Mo, ayusin Mo, i-provide Mo.” Pero hindi ko nadala ang puso kong nagsasabing, “Lord, Ikaw mismo ang kailangan ko.” At kapag checklist lang ang dala, mabilis akong aalis kapag nakuha ko na. Pero kapag si Jesus mismo ang hinanap ko, kahit hindi pa nasasagot ang lahat, payapa pa rin ako — dahil kasama ko Siya."}),a("p",{children:"Hindi ko maiwasang tanungin ang sarili ko: sapat na ba sa akin si Jesus? O kailangan ko pa ng dagdag para maging payapa? Ang babaeng ito ay nagturo sa akin na ang tunay na pananampalataya ay hindi nagtatapos sa “salamat, gumaling na ako.” Nagtatapos ito sa “salamat, nakilala Kita.” At kapag nakilala mo si Jesus nang personal, kahit hindi pa perpekto ang buhay, puwede ka nang humayo nang payapa."})]}),A("div",{className:"mt-10 flex justify-between",children:[a("button",{onClick:()=>u("k8"),className:"text-[13px] font-bold uppercase tracking-[0.12em] text-[#8C6A2F]",children:"← Kabanata 8"}),a("button",{onClick:()=>u("k10"),className:"h-11 px-6 rounded-full bg-[#1A1A1A] text-white text-[13px] font-bold uppercase tracking-[0.12em]",children:"Kabanata 10 →"})]})]}),A("section",{id:"k10",className:"scroll-mt-10 max-w-[760px] mx-auto py-12",children:[a(fe,{num:"KABANATA 10",title:"WHO TOUCHED ME? — Ang Tanong na Hindi Ko Matatakasan"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#222222]",style:{fontFamily:"'Merriweather', serif"},children:[a("p",{className:"dropcap",children:"Sa wakas, bumabalik tayo sa tanong na nagsimula ng lahat: “Who touched me?” Habang binabasa ko ito sa huling pagkakataon para sa aklat na ito, napagtanto kong hindi ito tanong na pang-impormasyon. Alam ni Jesus kung sino ang humipo sa Kanya. Alam Niya kung sino ang gumaling. Ang tanong na ito ay hindi dahil hindi Niya alam — kundi dahil gusto Niyang tayo mismo ang sumagot."}),a("p",{children:"Ito ang tanong na hindi ko matatakasan. Dahil sa dami ng beses kong nasa crowd, sa dami ng beses kong dumalo, kumanta, naglingkod — tinatanong pa rin ako ni Jesus nang personal: “Ikaw ba ang humipo sa Akin? Ikaw ba yung may pananampalataya?” At kailangan kong sumagot. Hindi puwedeng si pastor ang sumagot para sa akin. Hindi puwedeng ang asawa ko, ang magulang ko, ang kaibigan ko. Ako mismo."}),a("p",{children:"Napaisip ako: anong klaseng paghipo ang ginagawa ko ngayon? Paghipo ba ng tradisyon — ginagawa kasi nakasanayan? Paghipo ba ng obligasyon — ginagawa kasi kailangan? O paghipo ng pananampalataya — ginagawa kasi naniniwala akong si Jesus lang ang makakapagpabago sa akin?"}),a(Ne,{children:"Ang tanong ni Jesus ay hindi para hiyain ka, kundi para anyayahan kang lumabas sa anino at tumayo sa liwanag ng Kanyang biyaya."}),a("p",{children:"Kung ako ang nasa kalagayan niya, ang tanong na ito sana ang magpapalaya sa akin mula sa pagtatago. Labindalawang taon siyang nagtago dahil sa hiya. Pero sa tanong na ito, tinawag siyang lumabas. At nang lumabas siya, doon siya lubusang gumaling. Ganoon din tayo — may mga bahagi sa atin na matagal nang nagtatago: sugat, kasalanan, pangarap na hindi sinasabi, takot na hindi inaamin. Pero tinatanong tayo ni Jesus: “Who touched me?” Ibig sabihin, “Nasaan ka? Magpakilala ka. Gusto kitang pagalingin nang buo.”"}),a("p",{children:"Dito ako tinamaan sa pinakamalalim na bahagi. Hindi sapat na mahawakan ko lang ang laylayan ng damit ni Jesus. Kailangan kong hayaan na mahawakan din Niya ang puso ko. At mangyayari lang iyon kapag sumagot ako sa tanong Niya. Kapag sinabi kong, “Panginoon, ako po iyon. Ako po yung pagod na, pero nagtitiwala pa rin. Ako po yung mahina, pero kumakapit pa rin. Ako po yun.”"}),a("p",{children:"Hindi ko maiwasang tanungin ang sarili ko ngayon, sa pagtatapos ng aklat na ito: ano ang sagot ko? Lalabas ba ako mula sa crowd at sasabihin kong, “Ako, Panginoon, ako ang humipo sa Iyo”? O mananatili akong nagtatago, kuntento nang gumaling nang palihim, pero hindi kailanman nakilala nang personal?"}),a("p",{children:"Ang panalangin ko para sa iyo, mambabasa, ay ito: na sa oras na basahin mo ang huling pahinang ito, magkaroon ka ng lakas ng loob na sumagot. Sabihin mo sa Kanya: “Ako, Jesus. Ako ang humipo sa Iyo. Hindi dahil malakas ako, kundi dahil kailangan kita. Pagalingin Mo ako. Kilalanin Mo ako. Tawagin Mo akong anak.” At maniwala ka — kapag sumagot ka nang ganoon, hihinto si Jesus para sa iyo, kahit gaano pa karami ang tao sa paligid. Dahil ang isang pusong humihipo nang may pananampalataya ay laging hinahanap, laging pinapansin, at laging minamahal ni Jesus."})]}),A("div",{className:"mt-12 rounded-[20px] bg-[#1A1A1A] p-7 md:p-9 text-[#F5ECD7]",children:[a("p",{className:"text-[13px] tracking-[0.22em] uppercase font-bold text-[#D6C5A0] mb-3",children:"Tandaan mo"}),a("p",{className:"text-[20px] md:text-[22px] leading-[1.6] font-bold italic",style:{fontFamily:"'Merriweather', serif"},children:"“Hindi mo kailangang sumigaw para marinig. Hindi mo kailangang magpakitang-gilas para mapansin. Sapat na ang isang tahimik, nanginginig, pero totoong paghawak kay Jesus.”"})]}),A("div",{className:"mt-10 flex justify-between",children:[a("button",{onClick:()=>u("k9"),className:"text-[13px] font-bold uppercase tracking-[0.12em] text-[#8C6A2F]",children:"← Kabanata 9"}),a("button",{onClick:()=>u("pangwakas"),className:"h-11 px-6 rounded-full bg-[#8C6A2F] text-white text-[13px] font-bold uppercase tracking-[0.12em]",children:"Pangwakas →"})]})]}),a(tu,{}),A("section",{id:"pangwakas",className:"scroll-mt-10 max-w-[760px] mx-auto py-12",children:[a(fe,{num:"PANGWAKAS",title:"Pagkatapos ng Tanong, Ano ang Sagot Ko?"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#222222]",style:{fontFamily:"'Merriweather', serif"},children:[a("p",{className:"dropcap",children:"Habang tinatapos ko ang aklat na ito, hindi ko maiwasang balikan ang una kong tanong: ako ba ay nakikisiksik lang, o tunay na humihipo? At habang sinusulat ko ang bawat kabanata, unti-unti kong naunawaan na ang tanong na “Who touched me?” ay hindi isang beses lang tinatanong ni Jesus. Araw-araw Niya itong tinatanong."}),a("p",{children:"Araw-araw, may crowd na sumisiksik sa Kanya — mga taong busy, mga taong may kailangan, mga taong may pinagdadaanan. At araw-araw, hinahanap Niya ang pusong may pananampalataya. Hindi ingay ang hinahanap Niya. Hindi performance. Hindi perpekto. Ang hinahanap Niya ay isang pusong nagsasabing, “Panginoon, Ikaw lang.”"}),a("p",{children:"Kaya pagkatapos ng lahat ng pagninilay na ito, ano ang sagot ko? Ang sagot ko ay simple: Panginoon, ako po iyon. Ako po yung matagal nang naghihintay. Ako po yung naubusan na. Ako po yung tahimik na lumalapit, nanginginig, nahihiya, pero nagtitiwala. Ako po yung humipo sa laylayan ng Iyong damit, at umaasang may kapangyarihang lalabas mula sa Iyo patungo sa akin."}),a("p",{children:"Kung binabasa mo ito at pagod ka na, gusto kong malaman mong hindi mo kailangang maging malakas para lumapit. Hindi mo kailangang ayusin muna ang lahat. Hindi mo kailangang maging karapat-dapat. Ang kailangan mo lang ay isang hakbang ng pananampalataya — isang maliit na paghawak, pero may buong puso."}),a("p",{children:"Ang gintong pananampalataya ay hindi yung walang takot. Ang gintong pananampalataya ay yung kahit takot, humahawak pa rin. Ang gintong pananampalataya ay hindi yung walang luha — kundi yung kahit lumuluha, nagtitiwala pa rin. At ang pananampalatayang iyon, gaano man kaliit, ay nakikita, naririnig, at pinahahalagahan ni Jesus."})]})]}),a("section",{id:"panalangin",className:"scroll-mt-10 max-w-[760px] mx-auto py-12",children:A("div",{className:"rounded-[28px] bg-white border border-[#EFE6D1] shadow-[0_16px_48px_rgba(140,106,47,0.1)] p-8 md:p-12",children:[a(fe,{num:"HULING PANALANGIN",title:"Isang Panalangin ng Paghawak"}),A("div",{className:"space-y-[1.2em] text-[18px] md:text-[20px] leading-[1.95] text-[#2B261B] italic",style:{fontFamily:"'Merriweather', serif"},children:[a("p",{children:"Panginoong Jesus,"}),a("p",{children:"Ako po ito — ang nasa gitna ng karamihan, pero pakiramdam ay nag-iisa. Ang malapit sa Iyo sa pisikal, pero minsan malayo ang puso. Patawarin Mo ako kung maraming beses akong nakisiksik lang, pero hindi tunay na humipo nang may pananampalataya."}),a("p",{children:"Ngayon, lumalapit ako nang tahimik. Hindi para magpakitang-gilas. Hindi para humingi ng atensyon. Lumalapit ako kasi kailangan Kita. Labindalawang taon man o labindalawang araw o labindalawang oras pa lang ang pinagdadaanan ko — pagod na ako, Panginoon. At Ikaw lang ang pag-asa ko."}),a("p",{children:"Hinahawakan ko ang laylayan ng Iyong damit sa panalangin. Nanginginig man ang kamay ko, hawak ko pa rin. Naniniwala akong may kapangyarihang lalabas mula sa Iyo. Pagalingin Mo ako — hindi lang sa katawan, kundi sa puso, sa isip, sa buong pagkatao."}),a("p",{children:"Tawagin Mo akong anak. Bigyan Mo ako ng kapayapaang hindi kayang ibigay ng mundo. At turuan Mo akong humayo nang payapa, hindi dahil perpekto na ang lahat, kundi dahil kasama na Kita."}),a("p",{className:"font-bold not-italic",children:"Sa pangalan ni Jesus, na huminto para sa isang katulad ko — Amen."})]})]})}),A("section",{id:"may-akda",className:"scroll-mt-10 max-w-[760px] mx-auto py-16",children:[A("div",{className:"flex flex-col md:flex-row gap-8 items-start",children:[a("div",{className:"w-20 h-20 rounded-full bg-[#1A1A1A] text-[#F9E8B0] flex items-center justify-center text-[28px] font-bold shrink-0",style:{fontFamily:"'Cormorant Garamond', serif"},children:"AM"}),A("div",{className:"flex-1",children:[a("p",{className:"text-[12px] tracking-[0.28em] uppercase font-bold text-[#8C6A2F] mb-2",children:"Tala ng May-Akda"}),a("h3",{className:"text-[26px] font-bold text-[#1A1A1A]",style:{fontFamily:"'Cormorant Garamond', serif"},children:"Aldwin M. Astelero"}),A("div",{className:"mt-4 space-y-4 text-[16px] md:text-[18px] leading-[1.9] text-[#3A3323]",style:{fontFamily:"'Merriweather', serif"},children:[a("p",{children:"Si Aldwin ay isang mananampalataya, mangangaral, at manunulat na ang puso ay para sa mga tahimik na naghahanap. Hindi siya estranghero sa paghihintay, sa pagkaubos, at sa tahimik na paghawak. Ang aklat na ito ay isinulat mula sa kanyang sariling paglalakbay — na minsan, hindi mo kailangang sumigaw para marinig ka ng Diyos."}),a("p",{children:"Ang “WHO TOUCHED ME?” ay paanyaya para sa bawat Pilipinong Kristiyanong pagod na sa relihiyosong routine at sabik na sa tunay na pagtatagpo kay Jesus. Nawa, sa pagbabasa mo, maramdaman mong hinahanap ka rin Niya — at hindi ka Niya kailanman makakalimutan."}),a("p",{className:"pt-2 text-[13px] tracking-[0.14em] uppercase font-bold text-[#8C6A2F]",children:"Maraming salamat sa pagbabasa. Hanggang sa muli nating paghawak kay Jesus."})]})]})]}),A("div",{className:"mt-16 pt-10 border-t border-[#EFE6D1] text-center",children:[a("p",{className:"text-[12px] tracking-[0.24em] uppercase font-bold text-[#8C6A2F] mb-3",children:"OMF Literature • CBN Asia • Premium Readable Edition • 2025"}),a("p",{className:"text-[13px] leading-[1.6] text-[#8A7D62] max-w-[48ch] mx-auto",style:{fontFamily:"'Merriweather', serif"},children:"Inihandog para sa bawat pusong nanginginig pa ring humahawak. Ang gintong pananampalataya ay hindi nasusukat sa lakas ng hawak, kundi sa katapatan ng Hinahawakan."}),a("button",{onClick:()=>u("cover"),className:"mt-8 h-11 px-7 rounded-full border border-[#8C6A2F] text-[#8C6A2F] text-[12px]
